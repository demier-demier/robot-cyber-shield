[package]
name = "robot-shield-browser"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Browser demonstration adapter for the shared Robot Cyber Shield verifier"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
robot-cyber-shield = { path = "../..", default-features = false }
serde_json = "1"
wasm-bindgen = "=0.2.130"
